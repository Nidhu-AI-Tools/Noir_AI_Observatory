version: 1
provider:
  default: ollama
ollama:
  baseUrl: http://127.0.0.1:11434
  defaultModel: llama3.1:8b
  timeoutMs: 180000
  temperature: 0.2
  contextTokens: 16384
  maxOutputTokens: 1200
selection:
  lookbackHours: 48
  maxCandidates: 12
  maxPerCategory: 3
output:
  maxHighlights: 5
  maxSummaryCharacters: 700
  maxSignificanceCharacters: 700
