name: Edit a Model Lab profile
description: Change a model ID, limits, display name, or enabled status.
title: "[Model Edit] "
labels: []
body:
  - type: input
    id: profile-id
    attributes: { label: Model profile ID }
    validations: { required: true }
  - type: input
    id: display-name
    attributes:
      { label: Display name, description: Leave blank to keep unchanged. }
  - type: input
    id: model
    attributes:
      { label: Provider model ID, description: Leave blank to keep unchanged. }
  - type: input
    id: timeout
    attributes:
      {
        label: Timeout milliseconds,
        description: Leave blank to keep unchanged.,
      }
  - type: input
    id: output
    attributes:
      {
        label: Maximum output tokens,
        description: Leave blank to keep unchanged.,
      }
  - type: dropdown
    id: status
    attributes:
      label: Status
      options: [unchanged, enabled, disabled]
    validations: { required: true }
  - type: textarea
    id: reason
    attributes: { label: Reason for change }
    validations: { required: true }
