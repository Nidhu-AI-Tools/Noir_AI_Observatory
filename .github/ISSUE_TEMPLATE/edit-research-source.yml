name: Edit a research source
description: Change a research source query, feed metadata, category, tags, weight, or status.
title: "[Research Edit] "
body:
  - type: input
    id: source-id
    attributes:
      label: Research source ID
    validations:
      required: true
  - type: input
    id: display-name
    attributes:
      label: Display name
      description: Optional. Leave empty to preserve the value.
  - type: input
    id: arxiv-query
    attributes:
      label: arXiv query
      description: Optional and valid only for arxiv_query sources.
  - type: input
    id: feed-url
    attributes:
      label: Public HTTPS feed URL
      description: Optional and valid only for rss_feed sources.
  - type: input
    id: publisher
    attributes:
      label: Publisher
  - type: input
    id: category
    attributes:
      label: Category
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Optional complete comma-separated list.
  - type: dropdown
    id: weight
    attributes:
      label: Source weight
      description: Reviewed source-priority metadata from 1 (low) to 5 (high).
      options: [unchanged, "1", "2", "3", "4", "5"]
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      options: [unchanged, enabled, disabled]
    validations:
      required: true
  - type: input
    id: organization-ids
    attributes:
      label: Organization IDs
      description: Optional complete comma-separated list. Leave all facet fields empty to preserve current defaults.
  - type: input
    id: venue-ids
    attributes:
      label: Venue IDs
      description: Optional complete comma-separated list.
  - type: input
    id: topic-ids
    attributes:
      label: Topic IDs
      description: Optional complete comma-separated list.
  - type: textarea
    id: coverage-description
    attributes:
      label: Coverage description
      description: Optional. Leave empty to preserve the current description.
  - type: textarea
    id: reason
    attributes:
      label: Why is this change needed?
    validations:
      required: true
