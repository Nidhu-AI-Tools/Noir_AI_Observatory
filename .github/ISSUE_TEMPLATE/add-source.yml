name: Add a tracked source
description: Propose a GitHub repository or Hugging Face organization for the observatory.
title: "[Source Add] "
body:
  - type: markdown
    attributes:
      value: After submission, a maintainer validates the request by applying the `source:approved` label.
  - type: dropdown
    id: source-type
    attributes:
      label: Source type
      options:
        - github_repo
        - huggingface_org
    validations:
      required: true
  - type: input
    id: locator
    attributes:
      label: Locator
      description: Use owner/repository for GitHub or the organization identifier for Hugging Face.
      placeholder: qdrant/qdrant
    validations:
      required: true
  - type: input
    id: display-name
    attributes:
      label: Display name override
      description: Optional. Leave empty to use the name returned by the provider.
  - type: input
    id: category
    attributes:
      label: Category ID
      description: Use an ID from config/taxonomy.yaml, such as vector-database.
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated; values are normalized to lowercase kebab-case.
      placeholder: vector-search, rag
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description override
      description: Optional. Leave empty to use the provider description.
  - type: textarea
    id: reason
    attributes:
      label: Why should this source be tracked?
    validations:
      required: true
