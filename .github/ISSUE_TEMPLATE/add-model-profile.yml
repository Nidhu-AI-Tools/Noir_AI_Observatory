name: Add a Model Lab profile
description: Propose a model configuration for consensus runs. This never submits a paid API call.
title: "[Model Add] "
labels: []
body:
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [openai, anthropic, google]
    validations: { required: true }
  - type: input
    id: display-name
    attributes: { label: Display name, placeholder: OpenAI comparison model }
    validations: { required: true }
  - type: input
    id: model
    attributes:
      {
        label: Provider model ID,
        description: Use the exact stable model ID accepted by the provider API.,
      }
    validations: { required: true }
  - type: input
    id: timeout
    attributes: { label: Timeout milliseconds, value: "60000" }
    validations: { required: true }
  - type: input
    id: output
    attributes: { label: Maximum output tokens, value: "800" }
    validations: { required: true }
  - type: textarea
    id: reason
    attributes:
      {
        label: Why should this model be compared?,
        description: Explain the model's distinct value to the dataset.,
      }
    validations: { required: true }
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I understand that adding a profile does not enable scheduled or paid calls.
          required: true
