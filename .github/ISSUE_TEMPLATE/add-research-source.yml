name: Add a research source
description: Propose an arXiv query or official RSS/Atom announcement feed.
title: "[Research Add] "
body:
  - type: markdown
    attributes:
      value: Fill only the locator fields for the selected source type. A maintainer applies `research:approved` after review.
  - type: dropdown
    id: source-type
    attributes:
      label: Source type
      options: [arxiv_query, rss_feed]
    validations:
      required: true
  - type: input
    id: display-name
    attributes:
      label: Display name
      placeholder: arXiv Machine Learning
    validations:
      required: true
  - type: input
    id: arxiv-query
    attributes:
      label: arXiv query
      description: Required for arxiv_query; for example cat:cs.LG.
  - type: input
    id: feed-url
    attributes:
      label: Public HTTPS feed URL
      description: Required for rss_feed. Use an official RSS or Atom endpoint.
  - type: input
    id: publisher
    attributes:
      label: Publisher
      description: Required for rss_feed.
  - type: input
    id: category
    attributes:
      label: Category
      placeholder: research-paper
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      placeholder: machine-learning, research
    validations:
      required: true
  - type: dropdown
    id: weight
    attributes:
      label: Source weight
      description: Match-ranking weight from 1 (low) to 5 (high).
      options: ["3", "1", "2", "4", "5"]
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why should this source be tracked?
    validations:
      required: true
