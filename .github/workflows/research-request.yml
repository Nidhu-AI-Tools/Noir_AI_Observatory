name: Process approved research source request

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare-research-change:
    if: >-
      github.event.label.name == 'research:approved' &&
      (startsWith(github.event.issue.title, '[Research Add]') || startsWith(github.event.issue.title, '[Research Edit]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate, dry-check, and apply request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: pnpm research-source:request
      - name: Create configuration pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          branch="research-request-${ISSUE_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add config/research-sources.yaml
          git commit -m "config: apply research source request #${ISSUE_NUMBER}"
          git push --set-upstream origin "$branch"
          gh pr create --title "Apply research source request #${ISSUE_NUMBER}" --body "Closes #${ISSUE_NUMBER}" --base main --head "$branch"
      - name: Comment when validation fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'The approved research request could not be applied. Review the workflow logs, correct the form, remove `research:approved`, and apply it again.'
            });
