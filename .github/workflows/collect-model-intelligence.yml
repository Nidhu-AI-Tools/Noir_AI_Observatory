name: Collect model intelligence

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repository-data-updates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      data_ready: ${{ steps.ready.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: main }
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm model:validate
      - name: Materialize public model observations
        id: collection
        continue-on-error: true
        env:
          MODEL_INTELLIGENCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          MODEL_INTELLIGENCE_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
        run: pnpm model-intelligence:collect
      - run: pnpm model-intelligence:validate
      - name: Verify dashboard build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: pnpm build
      - name: Commit model event dataset
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/model-events data/model-runs
          git add data/model-events data/model-runs
          if git diff --cached --quiet; then
            echo "No model intelligence changed."
          else
            git commit -m "data: collect model intelligence for $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - id: ready
        if: always() && steps.collection.outcome != 'cancelled' && steps.commit.outcome == 'success'
        run: echo "value=true" >> "$GITHUB_OUTPUT"
      - if: steps.collection.outcome == 'failure'
        run: exit 1

  deploy:
    if: always() && needs.collect.outputs.data_ready == 'true'
    needs: collect
    uses: ./.github/workflows/deploy-pages.yml
    secrets: inherit
